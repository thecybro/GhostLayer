<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GhostLayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#05070a; padding:40px; display:flex; justify-content:center;">
<div id="popup">
    <div class="hero">
        <div class="header">
            <div class="brand">
                <span class="logo-dot"></span>
                <span class="title">GhostLayer</span>
            </div>
    
            <div class="status">
                Secure
            </div>
        </div>
    
        <div class="greeting">
            <div class="greeting-title">
                Welcome,<span class="username" id="username"></span>
            </div>

            <!--Didn't think it would be good lmao-->
            <!--<div class="greeting-subtitle">
                Talk to anyone securely with no overhead.
            </div>-->
        </div>
    </div>
    
    <div class="notification" id="notification"></div>
    <hr class="divider">
  
  <div class="section" id="identity-section">
    <div class="section-label">My Identity</div>
    <div class="name-input" id="name-input">
        <input type="text" class="username-input" id="username-input" placeholder="username (optional)">
    </div>
    <div class="identity-row">
        <button class="create-identity-btn" id="create-identity-btn">Create Identity</button>
      <span class="key-label" id="key-label"></span>
      <span class="key-value" id="key-id"></span>
    </div>
    <button class="copy-invite-btn" id="copy-invite-btn">Copy Invite</button>
  </div>
  
  <hr class="divider">
  <div class="section" id="friends-section">
    <div class="section-label">Friends</div>
    <div class="friends-list" id="friends-list">
      <div class="empty-state">No friends</div>
    </div>
    <div class="friend-details" id="friend-details">
        <input type="text" id="friend-nickname" placeholder="Nickname (optional)">
        <input type="text" id="friend-pubkey" placeholder="Paste public key">
    </div>
    <button class="btn" id="add-friend-btn">Add Friend</button>
  </div>
  <hr class="divider">
  <div class="footer">
      <!--Under test, currently leads to another bare input window-->
    <button class="settings-link" id="settings-link">
        Crypto Testing
        <!--<a href="test.html" target ="_blank">Crypto Testing</a>-->
    </button>
  </div>
</div>
<script type="module" src="testpopup.js"></script>
</body>
</html>
